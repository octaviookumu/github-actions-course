name: Multi-Event

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  hello_world:
    runs-on: ubuntu-latest
    steps:
      - name: Echo Basic Information
        run: |
          echo "Event Name: ${{ github.event_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "REF: ${{ github.ref }}"
          echo "Job ID: $GITHUB_JOB"
          echo "Job Action: $GITHUB_ACTION"
          echo "Actor: ${{ github.actor }}"
